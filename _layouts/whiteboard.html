<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{ page.title | escape }}</title>
<style>
@font-face {
  font-family: 'Kalam';
  src: url('/assets/vbox-ohci-gifs/fonts/Kalam-Bold.ttf');
  font-weight: 700;
}
@font-face {
  font-family: 'PatrickHand';
  src: url('/assets/vbox-ohci-gifs/fonts/PatrickHand-Regular.ttf');
}
html { background: #f6f3ea; }
body {
  margin: 0;
  padding: 48px 20px 72px;
  color: #1f2937;
  background: #f6f3ea;
  background-image: radial-gradient(#e6e0d2 1px, transparent 1px);
  background-size: 24px 24px;
  font-family: "DejaVu Sans", system-ui, -apple-system, sans-serif;
  line-height: 1.75;
}
article {
  max-width: 920px;
  margin: 0 auto;
  padding: 56px 64px 64px;
  background: #fffdf8;
  border: 1px solid #e7e1d3;
  border-radius: 18px;
  box-shadow: 0 18px 50px rgba(30, 41, 59, .08);
}
.kicker {
  font-family: 'PatrickHand', cursive;
  font-size: 1.05rem;
  letter-spacing: .02em;
  color: #64748b;
  margin-bottom: 10px;
}
h1, h2, h3 {
  font-family: 'Kalam', cursive;
  color: #111827;
  line-height: 1.2;
  font-weight: 700;
}
h1 {
  font-size: 2.6rem;
  margin: .2rem 0 1.2rem;
  padding-bottom: 12px;
  border-bottom: 3px solid #2563eb;
}
h2 {
  font-size: 1.8rem;
  margin: 2.4rem 0 .8rem;
  padding-bottom: 6px;
  border-bottom: 1px solid #e5e0d5;
}
h3 { font-size: 1.35rem; margin-top: 1.8rem; }
p { font-size: 1.02rem; margin: .8rem 0; }
img {
  display: block;
  max-width: 100%;
  margin: 26px auto;
  border-radius: 12px;
  border: 1px solid #e2e8f0;
  background: #faf9f5;
  box-shadow: 0 10px 30px rgba(15, 23, 42, .10);
}
pre {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-left: 4px solid #2563eb;
  border-radius: 8px;
  padding: 16px 18px;
  overflow-x: auto;
  font-family: "DejaVu Sans Mono", monospace;
  font-size: .86rem;
  line-height: 1.55;
}
code {
  font-family: "DejaVu Sans Mono", monospace;
  font-size: .9em;
  background: #f1f5f9;
  padding: 1px 5px;
  border-radius: 4px;
}
pre code { background: transparent; padding: 0; }
blockquote {
  margin: 1.2rem 0;
  padding: 2px 0 2px 18px;
  border-left: 3px solid #cbd5e1;
  color: #475569;
}
a { color: #1d4ed8; }
hr { border: 0; border-top: 1px solid #e5e0d5; margin: 32px 0; }
ul, ol { padding-left: 1.4rem; }
li { margin: .35rem 0; }
.highlight .c, .highlight .c1, .highlight .cm { color: #64748b; font-style: italic; }
.highlight .k, .highlight .kd, .highlight .kt { color: #7c3aed; }
.highlight .s, .highlight .s1, .highlight .s2, .highlight .sb, .highlight .sc { color: #15803d; }
.highlight .mi, .highlight .mf, .highlight .m, .highlight .mh { color: #b45309; }
.highlight .nf, .highlight .nv, .highlight .nb { color: #1d4ed8; }
.highlight .o, .highlight .ow { color: #be123c; }
.highlight .err { color: #b91c1c; }
@media (max-width: 720px) {
  article { padding: 32px 22px; }
  h1 { font-size: 2rem; }
  body { padding-top: 20px; }
}
</style>
</head>
<body>
<article>
<div class="kicker">Research note / VirtualBox USB / OHCI</div>
{{ content }}
</article>
</body>
</html>
